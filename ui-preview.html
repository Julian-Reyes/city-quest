<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <title>City Quest · Connected UI preview</title>
  <style>
    /* Preview-only shell. Shared data and components are imported below. */
    :root { --bg:#f5f3ed; --surface:#fffef9; --ink:#243c32; --muted:#79847a; --line:#e2e5db; --accent:#e96b44; --soft:#edf0e5; --shadow:0 12px 40px #243c3210; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button { font:inherit; cursor:pointer; color:inherit; }
    button:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
    button { border:0; background:none; }
    .preview { min-height:32px; padding:6px 24px; text-align:center; background:var(--ink); color:#f5f3ed; font-size:11px; letter-spacing:.05em; }
    .preview span { opacity:.65; }
    .app { max-width:1600px; margin:auto; }
    header { height:90px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 36px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:38px; height:38px; border-radius:12px; background:var(--ink); color:var(--surface); display:grid; place-items:center; font-size:25px; }
    .brand-name { font-size:23px; font-weight:750; letter-spacing:-1px; }
    .brand-name span { font-weight:400; }
    .location { margin-left:24px; padding-left:24px; border-left:1px solid var(--line); color:var(--muted); }
    .location strong { display:block; color:var(--ink); font-size:13px; }
    .header-actions { display:flex; align-items:center; gap:20px; }
    .theme-toggle { border:1px solid var(--line); border-radius:30px; padding:8px 15px; font-size:12px; }
    .avatar { width:35px; height:35px; display:grid; place-items:center; border-radius:50%; background:#eadbc4; color:#5e523f; font-size:12px; font-weight:700; }
    .quests { display:flex; justify-content:center; gap:8px; padding:20px 20px 12px; }
    .quest { padding:11px 20px; border:1px solid var(--line); border-radius:13px; color:var(--muted); font-size:13px; font-weight:600; white-space:nowrap; }
    .quest.active { border-color:var(--ink); background:var(--ink); color:var(--surface); box-shadow:0 4px 12px #243c3218; }
    .quest .emoji { font-size:18px; margin-right:8px; }
    main { padding:14px 36px 28px; }
    .intro { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .eyebrow { text-transform:uppercase; letter-spacing:2px; font-size:10px; font-weight:700; color:var(--accent); }
    h1 { font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:42px; letter-spacing:-1.7px; line-height:1.15; margin:7px 0; }
    .intro p { margin:0; color:var(--muted); font-size:13px; }
    .journey { display:flex; align-items:center; gap:12px; padding:10px 15px; border:1px solid var(--line); border-radius:14px; background:var(--surface); }
    .journey-icon { font-size:24px; }
    .journey strong { display:block; font-size:12px; }
    .journey small { color:var(--muted); font-size:11px; }
    .workspace { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:22px; height:580px; }
    .sidebar { display:flex; flex-direction:column; min-height:0; order:1; }
    .tabs { display:flex; gap:5px; padding:5px; border-radius:12px; background:var(--soft); margin-bottom:15px; }
    .tab { flex:1; padding:7px 10px; border-radius:8px; font-size:12px; color:var(--muted); }
    .tab.active { background:var(--surface); color:var(--ink); box-shadow:0 2px 6px #243c3208; }
    .categories { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:20px; }
    .category { padding:7px 11px; border:1px solid var(--line); border-radius:30px; background:var(--surface); font-size:11px; white-space:nowrap; }
    .category.active { border-color:var(--accent); background:#e96b4410; color:var(--accent); }
    .list-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .list-heading strong { font-size:12px; }
    .list-heading span { font-size:10px; color:var(--muted); }
    .venue-list { overflow:auto; padding:0 3px 8px 0; scrollbar-width:thin; }
    .venue-card { display:flex; width:100%; text-align:left; gap:13px; padding:14px; margin-bottom:9px; border:1px solid var(--line); border-radius:15px; background:var(--surface); transition:transform .18s,border-color .18s; }
    .venue-card:hover { transform:translateY(-2px); }
    .venue-card.selected { border-color:var(--accent); box-shadow:0 4px 14px #e96b440c; }
    .venue-art { flex-shrink:0; width:62px; height:68px; display:grid; place-items:center; font-size:29px; border-radius:10px; background:var(--art,#ece1d1); position:relative; overflow:hidden; }
    .venue-art::before { content:""; position:absolute; width:70px; height:70px; border:1px solid #ffffff80; border-radius:50%; right:-28px; bottom:-25px; }
    .venue-copy { flex:1; min-width:0; }
    .venue-copy h3 { margin:1px 0 3px; font-size:13px; font-weight:650; }
    .venue-copy p { margin:0 0 7px; font-size:10px; color:var(--muted); }
    .venue-meta { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); }
    .venue-tag { color:#64826b; }
    .map { order:0; position:relative; overflow:hidden; border:1px solid var(--line); border-radius:23px; background:#e7eadf; box-shadow:var(--shadow); }
    .map svg { width:100%; height:100%; display:block; }
    .map-grid { transform-origin:50% 50%; transition:transform .35s; }
    .map-top { position:absolute; top:20px; left:20px; right:20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .map-label { padding:9px 14px; background:#fffefaeb; color:#243c32; border:1px solid #ffffff; border-radius:10px; font-size:11px; box-shadow:0 4px 14px #243c3208; }
    .search-area { padding:9px 16px; background:#243c32; color:#fffefa; border-radius:25px; font-size:11px; box-shadow:0 4px 15px #243c3220; }
    .map-controls { position:absolute; right:19px; bottom:58px; padding:4px; display:flex; flex-direction:column; border-radius:12px; background:#fffef9; color:#243c32; box-shadow:var(--shadow); }
    .map-controls button { width:34px; height:32px; font-size:20px; }
    .map-controls button+button { border-top:1px solid #e2e5db; }
    .map-credit { position:absolute; right:18px; bottom:14px; font-size:9px; color:#617565; }
    .pin-layer { position:absolute; inset:0; pointer-events:none; transform-origin:50% 50%; transition:transform .35s; }
    .pin { pointer-events:auto; position:absolute; transform:translate(-50%,-50%); width:35px; height:35px; background:#fffef9; color:#243c32; border:2px solid #fffef9; border-radius:50% 50% 50% 8px; box-shadow:0 3px 10px #243c3225; font-size:17px; transition:background .2s; }
    .pin.selected { background:#e96b44; border-color:#e96b44; z-index:2; }
    .user-dot { position:absolute; top:55%; left:54%; width:13px; height:13px; background:#607eb9; border:3px solid white; border-radius:50%; box-shadow:0 0 0 7px #607eb91f; }
    .detail { position:absolute; left:20px; bottom:20px; width:280px; padding:18px; border-radius:17px; background:var(--surface); box-shadow:0 8px 30px #243c3218; }
    .detail-top { display:flex; justify-content:space-between; align-items:start; gap:10px; }
    .detail h2 { margin:4px 0; font-size:17px; letter-spacing:-.4px; }
    .detail p { margin:5px 0 14px; color:var(--muted); font-size:11px; }
    .close-detail { font-size:19px; line-height:1; padding:2px 5px; color:var(--muted); }
    .checkin { width:100%; padding:10px; border-radius:10px; background:var(--ink); color:var(--surface); font-size:12px; font-weight:600; }
    .footer { display:flex; justify-content:space-between; gap:20px; margin-top:18px; color:var(--muted); font-size:10px; }
    .footer strong { color:var(--ink); font-weight:500; }
    .empty { padding:30px 10px; text-align:center; color:var(--muted); font-size:12px; }
    .toast { position:fixed; bottom:25px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:12px 20px; border-radius:30px; font-size:12px; z-index:10; box-shadow:var(--shadow); }
    [hidden] { display:none!important; }
    body.dark { --bg:#17231f; --surface:#23322b; --ink:#f0eee5; --muted:#a1afa3; --line:#36443a; --soft:#1e2c25; --shadow:0 12px 40px #0002; }
    body.dark .preview { background:#0d1712; color:#f0eee5; }
    body.dark .category.active { background:#e96b441a; }
    body.dark .venue-tag { color:#a2c3a7; }
    @media(min-width:1500px) { .workspace { height:660px; } }
    @media(max-width:1000px) { header { padding:0 22px; } main { padding:14px 22px 22px; } .workspace { grid-template-columns:minmax(0,1fr) 300px; gap:16px; } .location { margin-left:14px; padding-left:14px; } .detail { width:245px; } .quest { padding:10px 14px; } }
    @media(max-width:767px) {
      header { height:72px; padding:0 18px; } .brand-name { font-size:21px; } .brand-mark { width:33px; height:33px; } .location,.avatar { display:none; }
      .preview { font-size:9px; padding:5px 10px; } .header-actions { gap:0; } .theme-toggle { padding:6px 11px; font-size:10px; }
      .quests { justify-content:start; overflow:auto; padding:14px 16px 8px; gap:5px; scrollbar-width:none; } .quest { padding:9px 12px; font-size:11px; } .quest .emoji { font-size:17px; margin-right:5px; }
      main { padding:12px 18px 20px; } h1 { font-size:34px; } .intro { margin-bottom:18px; } .intro p { font-size:11px; } .journey { padding:8px 10px; gap:6px; } .journey-icon { display:none; } .journey strong { font-size:10px; } .journey small { font-size:9px; }
      .workspace { display:flex; flex-direction:column; height:auto; gap:17px; } .sidebar { display:contents; } .tabs { order:0; margin-bottom:0; } .categories { order:1; margin-bottom:0; gap:7px; } .map { order:2; height:370px; flex-shrink:0; border-radius:18px; } .list-heading { order:3; margin-bottom:-8px; } .venue-list { order:4; max-height:none; overflow:visible; padding:0; }
      .map-top { top:14px; left:14px; right:14px; } .map-label { padding:7px 10px; font-size:10px; } .search-area { padding:8px 11px; font-size:10px; } .detail { left:14px; bottom:14px; width:245px; padding:14px; } .detail h2 { font-size:15px; } .detail p { margin-bottom:10px; } .map-controls { right:14px; bottom:48px; } .footer { font-size:9px; } .footer span:last-child { display:none; }
    }
    .loading-dots { display:inline-block; width:3ch; text-align:left; }
    .loading-dots > span:nth-child(2) { animation:loading-second-dot 1.5s step-end infinite; }
    .loading-dots > span:nth-child(3) { animation:loading-third-dot 1.5s step-end infinite; }
    @keyframes loading-second-dot { 0%,100% { opacity:0; } 33% { opacity:1; } }
    @keyframes loading-third-dot { 0%,100% { opacity:0; } 66% { opacity:1; } }
    @media(prefers-reduced-motion:reduce) { .loading-dots > span { animation:none!important; opacity:1; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }

    /* Connected preview overrides. All production components remain unchanged. */
    .live-workspace { height:660px; }
    .live-map .leaflet-container { font:inherit; z-index:0; background:var(--soft)!important; }
    .live-map .leaflet-control-attribution svg { width:12px; height:8px; display:inline; }
    .live-map .map-top { z-index:500; pointer-events:none; }
    .live-map .map-top button { pointer-events:auto; }
    .live-map .map-controls { z-index:500; bottom:40px; right:16px; }
    .map-controls button:disabled,.search-area:disabled { opacity:.5; cursor:default; }
    .sidebar { overflow:hidden; }
    .tabs { flex-shrink:0; }
    .tab { padding:7px 4px; white-space:nowrap; }
    .venue-list { flex:1; min-height:0; }
    .live-detail { color:var(--ink); max-height:350px; overflow:auto; flex-shrink:0; margin-bottom:14px; }
    .live-detail [style*="color: rgba(255"] { color:var(--muted)!important; }
    .live-detail button[style*="color: rgb(255"] { color:var(--ink)!important; }
    .live-detail > div > div { background:var(--surface)!important; border-color:var(--line)!important; }
    .visit-history { padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface); font-size:11px; }
    .visit-history summary { cursor:pointer; }
    .visit-history > div { border-top:1px solid var(--line); padding:12px 0; }
    .visit-history img { max-width:100%; max-height:180px; border-radius:8px; }
    .collection-workspace { grid-template-columns:minmax(0,1fr) 440px; }
    .collection-content { min-height:0; overflow:auto; flex:1; }
    .legacy-panel { color:#f0eee5; background:#17231f; border-radius:16px; min-height:300px; }
    .scope-note { font-size:11px; color:var(--muted); }
    .quest-overview .venue-card { align-items:center; }
    .location-notice { padding:10px 14px; border:1px solid var(--line); border-radius:12px; margin-bottom:16px; font-size:12px; }
    .modal-backdrop { position:fixed; inset:0; z-index:1000; background:#10201caa; backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; padding:20px; }
    .checkin-dialog { width:100%; max-width:440px; max-height:90dvh; overflow:auto; padding:24px; border-radius:20px; background:var(--surface); box-shadow:var(--shadow); }
    .checkin-dialog h2 { font:24px/1.2 Georgia,serif; margin:8px 0 20px; }
    .checkin-dialog label { display:block; font-size:12px; margin-bottom:6px; }
    .checkin-dialog textarea { width:100%; min-height:100px; resize:vertical; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); padding:12px; font:inherit; }
    .photo-actions { display:flex; gap:8px; margin:14px 0; }
    .photo-preview img { max-width:100%; max-height:200px; border-radius:10px; display:block; margin-bottom:10px; }
    .photo-preview { margin-bottom:14px; }
    .cancel-checkin { display:block; width:100%; margin-top:8px; padding:8px; color:var(--muted); }
    button:disabled { cursor:default; opacity:.6; }
    .achievement-unlock { text-align:center; }
    .achievement-emoji { font-size:70px; }
    .toast { pointer-events:none; z-index:2000; max-width:calc(100vw - 32px); text-align:center; }
    @media(max-width:767px) {
      .live-workspace { height:auto; }
      .sidebar { overflow:visible; }
      .live-detail { order:3; max-height:none; margin-bottom:0; }
      .live-map { height:380px; }
      .live-map .live-detail { position:absolute; left:12px; right:12px; bottom:12px; max-height:65%; z-index:550; margin:0; border-radius:16px; background:var(--surface); box-shadow:var(--shadow); }
      .live-map:has(.live-detail) .map-controls { bottom:auto; top:64px; }
      .collection-content { order:3; overflow:visible; }
      .collection-content:has(.passport-panel) { order:1; }
      .collection-workspace { display:flex; }
      .collection-workspace:has(.quest-overview),.collection-workspace:has(.legacy-panel):not(:has(.passport-panel)) { display:flex; }
      .collection-workspace:has(.quest-overview) .sidebar,.collection-workspace:has(.legacy-panel):not(:has(.passport-panel)) .sidebar { display:contents; }
      .modal-backdrop { align-items:flex-end; padding:0; }
      .checkin-dialog { max-width:none; border-radius:20px 20px 0 0; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
      .tabs { position:sticky; top:0; z-index:600; background:var(--soft); }
    }

    /* Passport journal shares the preview palette in both themes. */
    .tab { min-width:0; }
    .tab:last-child { flex:1.65; }
    .passport-journal { color:var(--ink); padding:0 1px 20px; }
    .passport-cover { padding:22px; border:1px solid var(--line); border-radius:18px; background:radial-gradient(ellipse at 100% 0%,#e96b440c,transparent 65%),var(--surface); box-shadow:var(--shadow); }
    .passport-cover-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .passport-cover-top .eyebrow { font-size:9px; letter-spacing:1.5px; }
    .passport-cover-symbol { width:32px; height:32px; border:1px solid var(--line); border-radius:50%; display:grid; place-items:center; color:var(--accent); font-size:19px; }
    .passport-cover h2 { margin:16px 0 7px; font:32px/1.1 Georgia,serif; letter-spacing:-1px; overflow-wrap:anywhere; }
    .passport-cover p { margin:0; font-size:12px; color:var(--muted); }
    .passport-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin:22px 0 18px; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .passport-stats > div + div { padding-left:18px; border-left:1px solid var(--line); }
    .passport-stats dt { color:var(--muted); font-size:10px; }
    .passport-stats dd { margin:4px 0 0; font:27px/1.1 Georgia,serif; }
    .passport-cover-foot { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; color:var(--muted); font-size:9px; }
    .passport-cover-foot > span:first-child { font-size:8px; letter-spacing:1px; }
    .passport-section-label { display:flex; justify-content:space-between; margin:24px 0 18px; font-size:10px; color:var(--muted); }
    .passport-section-label > span:first-child { text-transform:uppercase; letter-spacing:1.5px; }
    .passport-category { margin-bottom:22px; }
    .passport-category-title { display:flex; align-items:center; gap:8px; margin-bottom:11px; }
    .passport-category-title h3 { margin:0; font-size:12px; font-weight:600; }
    .passport-category-title > span { display:grid; place-items:center; min-width:21px; height:21px; padding:0 5px; border-radius:50%; background:var(--soft); color:var(--muted); font-size:10px; }
    .passport-stamp-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .passport-stamp { display:flex; flex-direction:column; min-width:0; padding:16px 14px 12px; text-align:left; border:1px solid var(--line); border-radius:15px; background:var(--surface); transition:transform .18s,border-color .18s; }
    .passport-stamp:hover { transform:translateY(-2px); border-color:var(--accent); }
    .passport-stamp.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .passport-stamp-top { display:flex; justify-content:space-between; align-items:start; gap:8px; margin-bottom:13px; }
    .passport-stamp-emblem { position:relative; display:grid; place-items:center; width:46px; height:46px; border:1px dashed var(--muted); border-radius:50%; background:var(--soft); font-size:22px; transform:rotate(-7deg); }
    .passport-stamp-emblem > span { position:absolute; bottom:-2px; right:-3px; display:grid; place-items:center; width:16px; height:16px; border:2px solid var(--surface); border-radius:50%; background:var(--ink); color:var(--surface); font-size:8px; }
    .passport-stamp-number { font:italic 17px Georgia,serif; color:var(--muted); opacity:.55; }
    .passport-stamp-photo { width:38px; height:38px; border-radius:9px; object-fit:cover; }
    .passport-stamp > strong { font-size:12px; line-height:1.4; font-weight:600; overflow-wrap:anywhere; }
    .passport-stamp > time { margin:5px 0 14px; color:var(--muted); font-size:10px; }
    .passport-stamp-footer { display:flex; justify-content:space-between; gap:6px; flex-wrap:wrap; width:100%; margin-top:auto; padding-top:10px; border-top:1px dashed var(--line); font-size:9px; color:var(--muted); }
    .passport-stamp-footer > span:first-child { color:var(--ink); }
    .passport-blank { text-align:center; padding:30px 20px; margin-top:16px; border:1px dashed var(--line); border-radius:18px; }
    .passport-blank-stamp { display:grid; place-items:center; width:65px; height:65px; margin:0 auto 18px; border:1px dashed var(--muted); border-radius:50%; color:var(--accent); font-size:30px; }
    .passport-blank h3 { font:21px/1.3 Georgia,serif; margin:0 0 8px; }
    .passport-blank p { color:var(--muted); font-size:12px; margin:0 0 20px; }
    @media(max-width:767px) { .tabs .tab { font-size:11px; } .passport-panel { margin-top:16px; } .passport-cover { padding:20px; } }

    /* Light achievement presentation; the existing dark panel is preserved. */
    body:not(.dark) .achievements-panel { color:var(--ink); background:transparent; }
    .light-achievements { padding:0 1px 20px; }
    .achievements-summary { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:22px; border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:var(--shadow); margin-bottom:24px; }
    .achievements-summary .eyebrow { font-size:9px; letter-spacing:1.5px; }
    .achievements-summary h2 { margin:10px 0 7px; font:32px/1.2 Georgia,serif; }
    .achievements-summary h2 span { display:block; font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--muted); }
    .achievements-summary p { margin:0; font-size:11px; color:var(--muted); }
    .achievements-summary-icon { display:grid; place-items:center; width:52px; height:52px; flex-shrink:0; background:var(--soft); border-radius:50%; font-size:25px; }
    .achievements-section { margin-bottom:22px; }
    .achievements-section > h3 { margin:0 0 12px; color:var(--muted); text-transform:uppercase; font-size:10px; font-weight:600; letter-spacing:1.5px; }
    .achievement-card { display:flex; align-items:center; gap:14px; padding:15px; margin-bottom:9px; border:1px solid var(--line); border-radius:15px; background:var(--surface); }
    .achievement-card.unlocked { border-color:#e96b4440; background:linear-gradient(#e96b4405,#e96b4405),var(--surface); }
    .achievement-icon { display:grid; place-items:center; flex-shrink:0; width:43px; height:43px; border-radius:12px; background:var(--soft); font-size:25px; }
    .achievement-card.locked .achievement-icon { filter:grayscale(1); }
