<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10201c">
<title>City Quest · Revamp</title>
<style>
  /* Revamp UI (desktop, plus a mobile layout under 640px), wired to live data by src/revamp2/app.js.
     Nothing here is imported by index.html or ui-preview.html. */
  :root {
    --night:#10201c; --night2:#0b1512; --card:#1d3730; --line:#2c4a41;
    --paper:#f6efdf; --ink:#1c2b25;
    --gold:#f2b84b; --coral:#ee6c4d; --mint:#7fd6b0; --sky:#7cc3e8; --plum:#b58ae0;
    --text:#f3efe3; --muted:#9db3a9;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--night2); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow:hidden; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  button:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .serif, h1, h2, h3.serif { font-family:Georgia,"Times New Roman",serif; font-weight:400; }
  .eyebrow { font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:20px; background:var(--card); border:1px solid var(--line); font-size:12px; white-space:nowrap; transition:.15s; }
  .chip:hover { border-color:var(--gold); }
  .chip.on { background:var(--gold); color:#2a1d00; border-color:var(--gold); font-weight:700; }
  .bar { height:7px; border-radius:7px; background:#ffffff14; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:7px; background:linear-gradient(90deg,var(--gold),var(--coral)); }

  .app { display:grid; grid-template-columns:240px 1fr; height:100vh; }

  /* ---------- sidebar ---------- */
  aside { display:flex; flex-direction:column; padding:22px 16px; background:var(--night); border-right:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:11px; padding:0 8px 24px; }
  .mark { width:40px; height:40px; border-radius:13px; background:linear-gradient(135deg,var(--gold),var(--coral)); display:grid; place-items:center; font-size:22px; }
  .brand b { font-family:Georgia,serif; font-size:21px; font-weight:400; letter-spacing:-.6px; }
  .brand small { display:block; color:var(--muted); font-size:11px; margin-top:-2px; }
  .city-pick { display:flex; align-items:center; gap:10px; width:100%; padding:11px 12px; margin-bottom:18px; border-radius:14px; background:var(--card); border:1px solid var(--line); text-align:left; }
  .city-pick small { display:block; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.1em; }
  .city-pick span:last-child { margin-left:auto; color:var(--muted); }
  nav.main { display:flex; flex-direction:column; gap:4px; }
  nav.main button { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:13px; color:var(--muted); font-weight:600; text-align:left; transition:.15s; }
  nav.main button:hover { background:#ffffff0a; color:var(--text); }
  nav.main button.on { background:#f2b84b1c; color:var(--gold); }
  nav.main .ic { font-size:19px; width:24px; text-align:center; }
  nav.main .count { margin-left:auto; font-size:11px; padding:2px 8px; border-radius:10px; background:#ffffff12; }
  .xp-card { margin-top:auto; padding:14px; border-radius:18px; background:linear-gradient(135deg,#ee6c4d22,#f2b84b18); border:1px solid #f2b84b33; }
  .xp-card .lv { display:flex; justify-content:space-between; font-size:12px; margin-bottom:8px; }
  .xp-card small { color:var(--muted); display:block; margin-top:7px; font-size:11px; }
  .me-row { display:flex; align-items:center; gap:10px; padding:16px 8px 0; }
  .avatar { width:36px; height:36px; border-radius:50%; background:#eadbc4; color:#5e523f; display:grid; place-items:center; font-weight:700; font-size:13px; }
  .me-row small { color:var(--muted); display:block; font-size:11px; }

  /* ---------- main ---------- */
  .stage { position:relative; overflow:hidden; display:flex; flex-direction:column; min-width:0; }
  .topbar { display:flex; align-items:center; gap:16px; padding:18px 32px; border-bottom:1px solid var(--line); background:var(--night); }
  .search { flex:1; max-width:520px; display:flex; align-items:center; gap:10px; height:44px; padding:0 16px; border-radius:14px; background:var(--night2); border:1px solid var(--line); color:var(--muted); }
  .search kbd { margin-left:auto; font:11px inherit; padding:2px 7px; border-radius:6px; background:#ffffff12; }
  .top-right { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .pill { padding:8px 14px; border-radius:20px; background:var(--card); border:1px solid var(--line); font-size:12px; font-weight:600; }
  .pill.fire { background:linear-gradient(135deg,#ee6c4d,#c2412d); border-color:transparent; }
  .views { flex:1; position:relative; min-height:0; }
  .view { position:absolute; inset:0; display:none; }
  .view.on { display:block; }
  .scroll { overflow-y:auto; padding:30px 36px 50px; height:100%; }
  .scroll > .inner { max-width:1180px; margin:auto; }
  h1 { font-size:38px; letter-spacing:-1.2px; line-height:1.1; margin:6px 0 4px; }
  .sub { color:var(--muted); }

  /* ---------- explore ---------- */
  .explore { display:grid; grid-template-columns:1fr 380px; height:100%; }
  .map { position:relative; overflow:hidden; background:radial-gradient(circle at 30% 30%,#1f4237 0,transparent 35%),radial-gradient(circle at 75% 60%,#233a45 0,transparent 30%),#14281f; }
  .map svg { position:absolute; inset:0; width:100%; height:100%; }
  .pin { position:absolute; width:40px; height:40px; border-radius:50% 50% 50% 4px; transform:rotate(-45deg); display:grid; place-items:center; border:2px solid #fff3; box-shadow:0 6px 14px #0007; transition:.15s; }
  .pin:hover { transform:rotate(-45deg) scale(1.15); }
  .pin b { transform:rotate(45deg); font-size:18px; font-weight:400; }
  .pin.visited { background:var(--mint); } .pin.new { background:var(--coral); }
  .pin.sel { background:var(--gold); width:50px; height:50px; box-shadow:0 0 0 9px #f2b84b33,0 0 0 20px #f2b84b14; z-index:3; }
  .me { position:absolute; left:46%; top:64%; width:16px; height:16px; border-radius:50%; background:var(--sky); border:3px solid #fff; box-shadow:0 0 0 12px #7cc3e833; }
  .map-ui { position:absolute; top:18px; left:20px; right:20px; display:flex; justify-content:space-between; gap:12px; pointer-events:none; }
  .map-ui > * { pointer-events:auto; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; }
  .filters .chip { background:#0c1815ee; backdrop-filter:blur(10px); }
  .filters .chip.on { background:var(--gold); }
  .zoom { display:flex; flex-direction:column; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#0c1815ee; }
  .zoom button { width:38px; height:38px; font-size:18px; }
  .zoom button + button { border-top:1px solid var(--line); }
  .legend { position:absolute; left:20px; bottom:20px; display:flex; gap:16px; padding:10px 16px; border-radius:14px; background:#0c1815ee; border:1px solid var(--line); font-size:12px; color:var(--muted); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .detail { display:flex; flex-direction:column; border-left:1px solid var(--line); background:var(--night); overflow-y:auto; }
  .hero-ph { height:210px; flex:none; position:relative; background:linear-gradient(135deg,#e9a25a,#b8452d); display:grid; place-items:center; font-size:84px; }
  .hero-ph::after { content:""; position:absolute; inset:auto 0 0 0; height:90px; background:linear-gradient(transparent,var(--night)); }
  .hero-ph .tag { position:absolute; top:14px; left:14px; z-index:2; font-size:11px; font-weight:700; padding:5px 11px; border-radius:20px; background:#000a; letter-spacing:.05em; }
  .d-body { padding:0 24px 24px; margin-top:-24px; position:relative; z-index:2; }
  .d-body h2 { font-size:28px; letter-spacing:-.8px; margin:4px 0; }
  .meta { color:var(--muted); font-size:13px; }
  .rate { color:var(--gold); margin-top:6px; }
  .facts { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0; }
  .fact { padding:12px; border-radius:14px; background:var(--card); border:1px solid var(--line); }
  .fact small { display:block; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.1em; }
  .fact strong { font-size:14px; }
  .cta { width:100%; height:54px; border-radius:16px; background:linear-gradient(135deg,var(--gold),#f08f3c); color:#2a1d00; font-weight:800; font-size:16px; box-shadow:0 8px 22px #f2b84b33; transition:.15s; }
  .cta:hover { transform:translateY(-1px); box-shadow:0 12px 28px #f2b84b44; }
  .cta.done { background:var(--mint); box-shadow:none; transform:none; }
  .cta small { font-weight:600; opacity:.7; margin-left:6px; }
  .nearby h4 { font-size:13px; margin:22px 0 10px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.1em; }
  .near { display:flex; align-items:center; gap:12px; width:100%; padding:10px; border-radius:14px; text-align:left; transition:.15s; }
  .near:hover { background:#ffffff0a; }
  .near .e { width:40px; height:40px; border-radius:12px; background:#ffffff12; display:grid; place-items:center; font-size:20px; }
  .near small { color:var(--muted); display:block; }
  .near .d { margin-left:auto; font-size:12px; color:var(--muted); }

  /* ---------- quests ---------- */
  .banner { display:flex; align-items:center; gap:18px; padding:20px 24px; border-radius:24px; background:linear-gradient(135deg,#ee6c4d,#c2412d); margin:22px 0; }
  .banner .flame { font-size:46px; }
  .banner strong { font-size:24px; display:block; line-height:1.1; }
  .banner .days { margin-left:auto; display:flex; gap:8px; }
  .banner .days span { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; background:#ffffff26; }
  .banner .days span.on { background:#fff; color:#c2412d; }
  .qgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; margin-top:18px; }
  .qcard { padding:20px; border-radius:22px; background:var(--card); border:1px solid var(--line); transition:.15s; }
  .qcard:hover { border-color:var(--gold); transform:translateY(-2px); }
  .qcard header { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .qcard .ic { width:50px; height:50px; border-radius:16px; display:grid; place-items:center; font-size:26px; background:#ffffff12; }
  .qcard h4 { font-size:16px; font-weight:650; }
  .qcard header small { color:var(--muted); }
  .qcard .pct { margin-left:auto; font-weight:800; color:var(--gold); font-size:18px; }
  .qcard .steps { display:flex; justify-content:space-between; margin-top:12px; font-size:11px; color:var(--muted); }
  .done { color:var(--mint); }
  .reward { display:inline-block; margin-top:14px; font-size:11px; padding:5px 11px; border-radius:10px; background:#7fd6b01a; color:var(--mint); }

  /* ---------- passport ---------- */
  .pp-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; }
  .switcher { display:flex; gap:4px; padding:5px; border-radius:16px; background:var(--night); border:1px solid var(--line); }
  .switcher button { padding:9px 22px; border-radius:12px; font-size:13px; font-weight:600; color:var(--muted); }
  .switcher button.on { background:var(--paper); color:var(--ink); }
  .pp-layout { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:24px; align-items:start; }
  .book { position:relative; overflow:hidden; border-radius:26px; padding:28px 30px 30px 40px; background:var(--paper); color:var(--ink);
    background-image:repeating-linear-gradient(0deg,transparent 0 31px,#0000000a 31px 32px); box-shadow:0 20px 44px #0006; }
  .book::before { content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background:repeating-linear-gradient(0deg,#c9bb97 0 9px,#bcae88 9px 12px); }
  .book.global { background-color:#1f4a58; color:var(--paper); background-image:radial-gradient(circle at 85% 15%,#ffffff18,transparent 50%); }
  .book.global::before { background:repeating-linear-gradient(0deg,#16384a 0 9px,#112d3b 9px 12px); }
  .book .hd { display:flex; justify-content:space-between; align-items:flex-start; }
  .book .hd .eyebrow { color:var(--coral); }
  .book.global .hd .eyebrow { color:var(--gold); }
  .book h2 { font-size:34px; letter-spacing:-1px; line-height:1.1; margin-top:4px; }
  .seal { width:74px; height:74px; border-radius:50%; border:2px dashed var(--coral); color:var(--coral); display:grid; place-items:center; text-align:center; font-size:10px; font-weight:800; line-height:1.1; transform:rotate(-12deg); }
  .book.global .seal { color:var(--gold); border-color:var(--gold); }
  .seal b { font-size:24px; display:block; }
  .stamps { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:26px; }
  .stamp { aspect-ratio:1; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8px; border:2px solid; font-size:12px; font-weight:700; line-height:1.15; gap:4px; transition:.2s; cursor:default; }
  .stamp:hover { transform:rotate(0) scale(1.07) !important; }
  .stamp .e { font-size:32px; }
  .stamp small { font-weight:500; opacity:.7; font-size:10px; }
  .s1 { color:#b3412a; border-color:#b3412a; transform:rotate(-4deg); }
  .s2 { color:#2c7a5e; border-color:#2c7a5e; transform:rotate(3deg); border-radius:50%; }
  .s3 { color:#2b6a95; border-color:#2b6a95; transform:rotate(-2deg); border-style:double; border-width:5px; }
  .s4 { color:#7a4fa6; border-color:#7a4fa6; transform:rotate(5deg); }
  .s5 { color:#a8741a; border-color:#a8741a; transform:rotate(-5deg); border-radius:50%; }
  .locked { color:#0000003a; border-color:#00000020; border-style:dashed; }
  .locked .e { filter:grayscale(1) opacity(.3); }
  .gstats { display:flex; gap:26px; margin-top:22px; font-size:14px; }
  .gmap { margin-top:22px; height:190px; border-radius:18px; background:#ffffff10; position:relative; overflow:hidden; }
  .gmap::before { content:""; position:absolute; inset:0; background-image:radial-gradient(#ffffff22 1.5px,transparent 1.5px); background-size:14px 14px; }
  .gdot { position:absolute; width:14px; height:14px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 6px #f2b84b33; }
  .gdot span { position:absolute; left:20px; top:-3px; font-size:11px; white-space:nowrap; }
  .side-col { display:flex; flex-direction:column; gap:14px; }
  .stats3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .stat { padding:16px; border-radius:18px; background:var(--card); border:1px solid var(--line); text-align:center; }
  .stat strong { display:block; font-family:Georgia,serif; font-weight:400; font-size:30px; }
  .stat small { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
  .sec-h { font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); font-weight:600; margin:10px 0 0; }
  .city { display:flex; align-items:center; gap:14px; padding:14px; border-radius:18px; background:var(--card); border:1px solid var(--line); }
  .city .sk { width:54px; height:54px; border-radius:16px; display:grid; place-items:center; font-size:28px; flex:none; }
  .city h5 { font-size:15px; font-weight:650; }
  .city small { color:var(--muted); font-size:12px; }
  .city .bar { margin-top:7px; }
  .city .ct { margin-left:auto; text-align:right; font-family:Georgia,serif; font-size:22px; padding-left:8px; }
  .city .ct small { display:block; font-family:-apple-system,sans-serif; font-size:10px; }
  .panel { display:none; } .panel.on { display:block; }

  /* ---------- badges ---------- */
  .b-head { display:flex; align-items:center; gap:28px; margin-bottom:22px; }
  .ring { width:130px; height:130px; flex:none; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--gold) 0 62%,#ffffff14 62% 100%); }
  .ring div { width:108px; height:108px; border-radius:50%; background:var(--night2); display:grid; place-items:center; text-align:center; line-height:1.1; }
  .ring strong { font-family:Georgia,serif; font-size:32px; font-weight:400; }
  .ring small { font-size:10px; color:var(--muted); display:block; }
  .bgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:18px; margin-top:22px; }
  .badge { text-align:center; padding:18px 10px 16px; border-radius:20px; background:var(--card); border:1px solid var(--line); font-size:12px; transition:.15s; }
  .badge:hover { transform:translateY(-3px); border-color:var(--gold); }
  .badge .hex { width:88px; height:88px; margin:0 auto 10px; display:grid; place-items:center; font-size:36px; clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%); }
  .badge.gold .hex { background:linear-gradient(135deg,#f9d77e,#d98d1f); }
  .badge.silver .hex { background:linear-gradient(135deg,#e8eeee,#8da0a0); }
  .badge.bronze .hex { background:linear-gradient(135deg,#f0b48a,#a0522d); }
  .badge.lock .hex { background:#ffffff10; filter:grayscale(1) opacity(.45); }
  .badge.lock { color:var(--muted); }
  .badge b { display:block; font-weight:650; font-size:13px; }
  .badge small { color:var(--muted); font-size:11px; }

  .toast { position:absolute; bottom:28px; left:50%; transform:translate(-50%,40px); opacity:0; padding:14px 22px; border-radius:16px; background:var(--paper); color:var(--ink); font-weight:700; box-shadow:0 14px 40px #000a; transition:.35s; z-index:50; pointer-events:none; }
  .toast.show { transform:translate(-50%,0); opacity:1; }

  /* ---------- venue bottom sheet + tab bar (only shown at narrow widths) ---------- */
  .sheet, .tabbar, .s-xp { display:none; }
  .grab { display:block; width:100%; padding:2px 0 12px; }
  .grab::before { content:""; display:block; width:40px; height:4px; border-radius:4px; background:#ffffff33; margin:auto; }
  .s-venue { display:flex; gap:14px; align-items:center; }
  .s-venue .ph { width:84px; height:84px; flex:none; border-radius:18px; display:grid; place-items:center; font-size:38px; }
  .s-venue h3 { font-size:18px; font-weight:650; letter-spacing:-.3px; }
  .s-venue .meta { font-size:12px; }
  .s-venue .rate { font-size:12px; margin-top:3px; }
  .s-venue .rate span { color:var(--muted); }
  .sheet .cta { margin-top:14px; height:50px; font-size:15px; }
  .sheet .nearby { display:none; max-height:34vh; overflow-y:auto; }
  .sheet.open .nearby { display:block; }
  .sheet .nearby h4 { margin-top:16px; }

  /* ---------- live data (src/revamp2/app.js) ---------- */
  #map { position:absolute; inset:0; z-index:0; background:#14281f; }
  .map-ui { z-index:5; align-items:flex-start; }
  .map-ui .filters { flex:1; min-width:0; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
  .map-ui .filters::-webkit-scrollbar { display:none; }
  .legend { z-index:5; }
  .zoom button:disabled { opacity:.35; cursor:default; }
  .leaflet-container { font:inherit; }
  .leaflet-control-attribution { background:#0c1815cc !important; color:var(--muted) !important; font-size:10px; border-radius:8px 0 0 0; }
  .leaflet-control-attribution a { color:var(--muted) !important; }
  .cq-icon { background:none; border:0; }
  .cq-icon .pin, .cq-icon .me { position:relative; left:auto; top:auto; }
  .cq-icon .pin { border-width:2px; }
  .cq-icon .pin.dot { width:14px; height:14px; border-radius:50%; transform:none; box-shadow:0 0 0 3px #0005; }
  .cq-icon .pin.dot:hover { transform:scale(1.4); }
  .area-btn, .map-status { position:absolute; top:70px; left:50%; transform:translateX(-50%); z-index:6; white-space:nowrap; }
  .area-btn { padding:9px 16px; border-radius:20px; background:var(--paper); color:var(--ink); font-weight:700; font-size:12px; box-shadow:0 8px 22px #0007; }
  .map-status { display:flex; align-items:center; gap:10px; padding:9px 16px; border-radius:20px; background:#0c1815ee; border:1px solid var(--line); font-size:12px; color:var(--muted); }
  .map-status button, .empty button, .pp-note button { color:var(--gold); font-weight:700; }
  [hidden] { display:none !important; }
  .spin { width:12px; height:12px; border-radius:50%; border:2px solid #ffffff33; border-top-color:var(--gold); animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .search input { flex:1; min-width:0; background:none; border:0; outline:none; color:var(--text); font:inherit; }
  .search input::placeholder { color:var(--muted); }
  .search:focus-within { border-color:var(--gold); }
  .muted { color:var(--muted); }
  .empty { padding:18px; border-radius:18px; border:1px dashed var(--line); color:var(--muted); text-align:center; font-size:13px; }
  .hero-ph { overflow:hidden; }
  .hero-ph img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .d-list { margin-top:0; padding-top:26px; }
  .d-back { display:inline-block; margin-bottom:6px; font-size:12px; font-weight:700; color:var(--gold); }
  .facts { grid-template-columns:1fr 1fr; }
  .fact strong { display:block; font-size:13px; }
  .cta.again { background:linear-gradient(135deg,var(--mint),#4fa37a); box-shadow:0 8px 22px #7fd6b02a; }
  .memo { margin-top:14px; padding:12px 14px; border-radius:14px; background:#f6efdf12; font-family:Georgia,serif; font-style:italic; }
  .near b { display:block; }
  .near small { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
  .s-venue .ph { overflow:hidden; }
  .s-venue .ph img { width:100%; height:100%; object-fit:cover; }
  .s-sum { display:block; width:100%; text-align:left; }
  .s-sum h3 { font-size:18px; font-weight:650; letter-spacing:-.3px; margin:2px 0; }
  .s-sum .meta { font-size:12px; }
  .s-sum .bar { margin-top:10px; }
  .qcard.complete { border-color:#7fd6b055; }
  .qcard .steps { flex-wrap:wrap; justify-content:flex-start; gap:6px 14px; }
  .qcard .steps button { font-size:11px; color:var(--muted); padding:0; }
  .qcard .steps button.done { color:var(--mint); }
  .qcard .steps button:hover { color:var(--gold); }
  .qgrid > .empty { grid-column:1/-1; }
  .switcher { overflow-x:auto; max-width:100%; scrollbar-width:none; }
  .switcher::-webkit-scrollbar { display:none; }
  .switcher button { white-space:nowrap; }
  button.stamp { cursor:pointer; background:none; }
  .stamp .nm { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .stamp .e img { display:block; width:36px; height:36px; border-radius:10px; object-fit:cover; }
  .stamps.latest { grid-template-columns:repeat(4,1fr); margin-top:4px; }
  .stamps.latest .stamp { color:var(--text); border-color:var(--line); }
  button.city { width:100%; text-align:left; transition:.15s; }
  button.city:hover { border-color:var(--gold); }
  .pp-note { color:var(--muted); font-size:12px; }
  .badge.silver { color:var(--text); }

  dialog.ci { margin:auto; width:min(420px, calc(100% - 32px)); padding:22px; border-radius:24px; border:0; background:var(--paper); color:var(--ink); box-shadow:0 30px 70px #000c; }
  dialog.ci::backdrop { background:#000a; backdrop-filter:blur(4px); }
  .ci .eyebrow { color:var(--coral); }
  .ci h3 { font-size:26px; letter-spacing:-.6px; line-height:1.15; margin:4px 0 14px; }
  .ci textarea { width:100%; resize:vertical; padding:12px; border-radius:14px; border:1px solid #0000001f; background:#fffaf0; color:var(--ink); font:inherit; font-size:16px; }
  .ci-photo { display:flex; align-items:center; gap:12px; margin-top:12px; }
  .ci-photo .chip { cursor:pointer; background:#fffaf0; border-color:#0000001f; color:var(--ink); }
  .ci-photo img { width:56px; height:56px; border-radius:12px; object-fit:cover; }
  .ci-actions { display:flex; gap:10px; margin-top:18px; }
  .ci-actions .chip { background:none; border-color:#00000026; color:var(--ink); padding:0 18px; }
  .ci-actions .cta { flex:1; height:50px; font-size:15px; }
  .ci-actions .cta:disabled { opacity:.6; }

  @media (max-width:1100px) { .explore { grid-template-columns:1fr 320px; } .pp-layout { grid-template-columns:1fr; } }
  @media (max-width:860px) { .app { grid-template-columns:72px 1fr; } aside .brand b, aside .brand small, .city-pick, nav.main span:not(.ic), .xp-card, .me-row div:last-child { display:none; } .explore { grid-template-columns:1fr; } .detail { display:none; }
    .legend { display:none; }
    .sheet { display:block; position:absolute; left:0; right:0; bottom:0; z-index:4; padding:10px 16px 18px; border-radius:28px 28px 0 0; background:linear-gradient(#18322bf5,#10201cfa); border-top:1px solid var(--line); backdrop-filter:blur(10px); }
  }

  /* ---------- mobile: mirrors claude-revamp.html ---------- */
  @media (max-width:640px) {
    .app { display:block; position:relative; height:100vh; height:100dvh; }
    aside { display:none; }
    .stage { height:100%; }
    .topbar { display:none; }
    .app[data-view="explore"] .topbar { display:flex; position:absolute; top:0; left:0; right:0; z-index:6; padding:calc(env(safe-area-inset-top) + 12px) 14px 0; background:none; border:0; pointer-events:none; }
    .topbar > * { pointer-events:auto; }
    .search { max-width:none; min-width:0; height:46px; border-radius:16px; background:#0c1815ee; backdrop-filter:blur(14px); }
    .search input { font-size:16px; }
    .search kbd, .top-right { display:none; }
    .search .s-xp { display:inline; margin-left:auto; flex:none; color:var(--gold); font-weight:700; font-size:12px; }

    /* explore */
    .map-ui { top:calc(env(safe-area-inset-top) + 68px); left:0; right:0; }
    .map-ui .filters { margin:0; }
    .area-btn, .map-status { top:calc(env(safe-area-inset-top) + 150px); }
    .map .leaflet-bottom.leaflet-right { bottom:auto; top:calc(env(safe-area-inset-top) + 112px); }
    .zoom { display:none; }
    .filters { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
    .filters::-webkit-scrollbar { display:none; }
    .map-ui .filters { padding:0 14px; }
    .sheet { padding-bottom:calc(94px + env(safe-area-inset-bottom)); }

    /* shared page chrome */
    .scroll { padding:calc(env(safe-area-inset-top) + 22px) 20px calc(110px + env(safe-area-inset-bottom)); }
    .scroll .filters { margin:0 -20px; padding:0 20px; }
    h1 { font-size:28px; letter-spacing:-.8px; line-height:1.15; margin-top:4px; }

    /* quests */
    .banner { flex-wrap:wrap; gap:14px; padding:16px; border-radius:22px; margin:16px 0; }
    .banner .flame { font-size:38px; }
    .banner strong { font-size:22px; }
    .banner > div:nth-child(2) { flex:1; min-width:0; font-size:13px; }
    .banner .days { margin-left:0; width:100%; justify-content:space-between; }
    .qgrid { grid-template-columns:1fr; gap:12px; margin-top:14px; }
    .qcard { padding:16px; }
    .qcard:hover { transform:none; }
    .qcard .ic { width:46px; height:46px; border-radius:15px; font-size:24px; }
    .qcard h4 { font-size:15px; }
    .qcard .pct { font-size:15px; }

    /* passport */
    .pp-head { flex-direction:column; align-items:stretch; gap:14px; margin-bottom:16px; }
    .switcher button { flex:1; padding:9px 0; font-size:12px; }
    .pp-layout { gap:14px; }
    .book { border-radius:22px; padding:18px 16px 16px 26px; box-shadow:0 14px 30px #0006; }
    .book::before { width:10px; }
    .book h2 { font-size:26px; letter-spacing:-.8px; }
    .seal { width:56px; height:56px; font-size:9px; }
    .seal b { font-size:16px; }
    .stamps { grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
    .stamp { min-width:0; border-radius:14px; padding:6px; font-size:10px; gap:3px; overflow-wrap:anywhere; }
    .book.global .stamps { gap:8px; }
    .stamp .e { font-size:24px; }
    .stamp small { font-size:9px; }
    .gstats { flex-wrap:wrap; gap:14px; margin-top:18px; font-size:12px; }
    .gmap { height:140px; margin-top:18px; }
    .stats3 { gap:10px; }
    .stat { padding:12px; border-radius:16px; }
    .stat strong { font-size:22px; }
    .city { padding:12px; }
    .city .sk { width:48px; height:48px; font-size:24px; }
    .city .ct { font-size:20px; }

    /* badges */
    .b-head { flex-direction:column; text-align:center; gap:14px; margin-bottom:16px; }
    .ring { width:120px; height:120px; }
    .ring div { width:100px; height:100px; }
    .ring strong { font-size:30px; }
    .bgrid { grid-template-columns:repeat(3,1fr); gap:16px 12px; margin-top:16px; }
    .badge { padding:0; background:none; border:0; border-radius:0; font-size:11px; }
    .badge:hover { transform:none; }
    .badge .hex { width:78px; height:78px; font-size:32px; margin-bottom:6px; }
    .badge b { font-size:11px; }
    .badge small { font-size:10px; }

    /* bottom tab bar */
    .tabbar { display:flex; position:fixed; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); height:64px; border-radius:22px; background:#0c1815ee; backdrop-filter:blur(14px); border:1px solid var(--line); justify-content:space-around; align-items:center; z-index:40; }
    .tabbar button { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:var(--muted); padding:6px 12px; border-radius:14px; }
    .tabbar button span { font-size:19px; line-height:1; }
    .tabbar button.on { color:var(--gold); background:#f2b84b1a; }

    /* toast drops from the top so it never covers the sheet or tab bar */
    .toast { top:calc(env(safe-area-inset-top) + 14px); bottom:auto; transform:translate(-50%,-40px); width:max-content; max-width:calc(100% - 32px); text-align:center; }
  }
</style>
</head>
<body>
<div class="app" data-view="explore">

  <aside>
    <div class="brand"><div class="mark">🧭</div><div><b>City Quest</b><small>Explore. Collect. Repeat.</small></div></div>
    <button class="city-pick" id="cityPick" title="Recenter on your location"><span style="font-size:20px">📍</span><div><small>Exploring</small><span id="cityName">Finding you…</span></div><span>⌖</span></button>
    <nav class="main" id="nav">
      <button class="on" data-view="explore"><span class="ic">🧭</span><span>Explore</span></button>
      <button data-view="quests"><span class="ic">🎯</span><span>Quests</span><span class="count" id="questCount">0</span></button>
      <button data-view="passport"><span class="ic">📘</span><span>Passport</span></button>
      <button data-view="badges"><span class="ic">🏅</span><span>Badges</span><span class="count" id="badgeCount">0</span></button>
    </nav>
    <div class="xp-card">
      <div class="lv"><b id="lvl">Level 1</b><span style="color:var(--gold)" id="xp">0 XP</span></div>
      <div class="bar"><i id="xpBar" style="width:0"></i></div>
      <small id="xpNext"></small>
    </div>
    <div class="me-row"><div class="avatar">JR</div><div><b>Julian</b><small>julianreyes.dev</small></div></div>
  </aside>

  <section class="stage">
    <div class="topbar">
      <label class="search">🔍 <input id="search" type="search" placeholder="Search venues on the map…" autocomplete="off" aria-label="Search venues on the map"> <kbd>⌘K</kbd><span class="s-xp">⚡ <span id="xp3">0</span> XP</span></label>
      <div class="top-right"><span class="pill fire" id="streakPill">🔥</span><span class="pill">⚡ <span id="xp2">0</span> XP</span></div>
    </div>

    <div class="views">

      <!-- EXPLORE -->
      <div class="view on" id="explore">
        <div class="explore">
          <div class="map">
            <div id="map"></div>
            <div class="map-ui">
              <div class="filters" id="cats"></div>
              <div class="zoom"><button id="zoomIn" aria-label="Zoom in">＋</button><button id="zoomOut" aria-label="Zoom out">－</button><button id="recenter" aria-label="Recenter on your location" disabled>⌖</button></div>
            </div>
            <button class="area-btn" id="areaBtn" hidden>↻ Search this area</button>
            <div class="map-status" id="mapStatus" role="status" hidden></div>
            <div class="sheet" id="sheet"></div>
            <div class="legend"><span><i style="background:var(--mint)"></i>Visited</span><span><i style="background:var(--coral)"></i>New</span><span><i style="background:var(--gold)"></i>Selected</span><span><i style="background:var(--sky)"></i>You</span></div>
          </div>
          <div class="detail" id="detail"></div>
        </div>
      </div>

      <!-- QUESTS -->
      <div class="view" id="quests"><div class="scroll"><div class="inner">
        <div class="eyebrow" id="questEyebrow">Your quests</div><h1>Quests</h1><p class="sub">Complete themed sets of venues to earn badges and XP. Tap a step to find one nearby.</p>
        <div class="banner" id="streak"></div>
        <div class="filters" id="questFilters"><button class="chip on" data-f="active">Active</button><button class="chip" data-f="all">All</button><button class="chip" data-f="done">Completed</button></div>
        <div class="qgrid" id="qgrid"></div>
      </div></div></div>

      <!-- PASSPORT -->
      <div class="view" id="passport"><div class="scroll"><div class="inner">
        <div class="pp-head">
          <div><div class="eyebrow">Passport</div><h1 id="ppTitle">Your world</h1><p class="sub" id="ppSub"></p></div>
          <div class="switcher" id="switcher"></div>
        </div>
        <div id="ppBody"></div>
      </div></div></div>

      <!-- BADGES -->
      <div class="view" id="badges"><div class="scroll"><div class="inner">
        <div class="b-head"><div class="ring" id="ring"><div><span><strong id="ringPct">0%</strong><small>complete</small></span></div></div><div><div class="eyebrow">Achievements</div><h1 id="badgeTitle"></h1><p class="sub" id="badgeSub"></p></div></div>
        <div class="filters" id="badgeFilters"><button class="chip on" data-f="all">All</button><button class="chip" data-f="earned">Earned</button><button class="chip" data-f="progress">In progress</button><button class="chip" data-f="locked">Locked</button></div>
        <div class="bgrid" id="bgrid"></div>
      </div></div></div>

    </div>
    <div class="toast" id="toast" role="status"></div>
  </section>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button class="on" data-view="explore"><span>🧭</span>Explore</button><button data-view="quests"><span>🎯</span>Quests</button><button data-view="passport"><span>📘</span>Passport</button><button data-view="badges"><span>🏅</span>Badges</button>
  </nav>
</div>

<dialog class="ci" id="ci" aria-labelledby="ciName">
  <form id="ciForm">
    <div class="eyebrow">Check in</div>
    <h3 id="ciName"></h3>
    <textarea id="ciNote" rows="3" placeholder="Add a note (optional)" aria-label="Note"></textarea>
    <div class="ci-photo">
      <label class="chip">📷 <span id="ciPhotoLabel">Add photo</span><input type="file" id="ciPhoto" accept="image/*" hidden></label>
      <img id="ciPreview" alt="Selected photo" hidden>
    </div>
    <div class="ci-actions"><button type="button" class="chip" id="ciCancel">Cancel</button><button type="submit" class="cta" id="ciSave">📘 Stamp passport</button></div>
  </form>
</dialog>

<!-- Live data: needs Vite (npm run dev) or the built site; ES module imports don't work from file://. -->
<script type="module" src="/src/revamp2/app.js"></script>
</body>
</html>
